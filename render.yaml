# Express.js + TypeScript backend

services:
  - type: web
    name: brokerbot-backend
    runtime: node
    plan: starter
    region: oregon
    repo: https://github.com/Up-to-code/real-estate-brokerbot-backend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brokerbot-postgres-db
          property: connectionString

  - type: cron
    name: cleanup-temp-files
    runtime: node
    schedule: "0 3 * * *"
    repo: https://github.com/Up-to-code/real-estate-brokerbot-backend
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm run cleanup

databases:
  - name: brokerbot-postgres-db
    plan: starter
    region: oregon